name: verify

# CI for gsd-contrib-toolkit (backlog #7 — the repo had no .github/ at all).
#
# TWO jobs, deliberately split by what a red result MEANS:
#
#   verify  — the toolkit against itself. Deterministic: depends on nothing outside this repo,
#             so a red here is always "this repo broke".
#   compat  — the toolkit against a REAL open-gsd/gsd-core checkout. A red here means either
#             this repo broke OR gsd-core drifted its script shapes — which is exactly the
#             HARD-02 alarm hooks/lib/doctor.cjs exists to raise ("catches a gsd-core refactor
#             BEFORE it silently fail-closed-bricks the gates"). Both are worth blocking on.
#
# Why this job split is load-bearing, not cosmetic: hooks/fault-injection.test.cjs resolves its
# source via resolveGsdCoreRoot(process.cwd()), which needs the sentinel layout (scripts/ +
# gsd-core/bin/lib/ + an identity script). Without a real checkout its 8 HARD-01/HARD-02 cases
# SKIP (its 2 hermetic sandbox-derivation cases still run: 10 cases in all, re-measured
# 2026-10-07). Until 2026-07-30 that skip read as PASS; EXEC-01 (bin/self-test.cjs) now makes an
# unexecuted, skipped OR FAILED load-bearing proof a FAILURE (failed cases since 2026-10-07: a
# stale sandbox had 2 of the 8 HARD-02 cases failing under a printed PASS), and `compat` is what supplies the checkout so they
# genuinely run. That combination is the honest-green requirement for this workflow.
#
# DO NOT add `self-test` to the `verify` job "for coverage" — it has no gsd-core checkout, so it
# would fail by design. `verify` deliberately tolerates the 8 skips; `compat` is where they must
# execute. Adding it would make people disable EXEC-01 to get green, which is the exact defect
# this whole workflow exists to prevent.
#
# Installs: this repo has no package.json and the `verify` job installs nothing. The `compat` job
# installs and builds its gsd-core checkout (`npm ci --ignore-scripts` + `npm run build:lib`),
# because gsd-core emits gsd-core/bin/lib/*.cjs from src/*.cts and gitignores most of that output.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Upstream gsd-core moves without this repo pushing. A weekly run surfaces a shape drift
    # (HARD-02) on its own schedule rather than waiting for the next commit here.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      # persist-credentials: false on every checkout: no job here pushes, so the job token never
      # needs to sit in .git/config while the suite and (in compat) registry packages run.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The suite. The 8 checkout-backed fault-injection cases SKIP here (no gsd-core checkout) —
      # expected and tolerated; `compat` below is where they must execute.
      - name: node --test
        run: node --test

      # NOTE: `verify-hooks` is NOT here either — re-measured 2026-10-07, without a gsd-core
      # checkout it proves only 14 of 62 cases ("14 pass, 0 fail, 48 skip") and exits 0 unless run
      # with --require-executed, AND it OVERWRITES the committed proofs/ corpus with degraded
      # `fixture: null` stubs as a side effect. A step that proves 14/62 and calls it green is the
      # exact defect this repo exists to stop, so it runs in `compat` (62/62, --require-executed)
      # instead. `node --test` above already covers the hook unit suites here.

      # NOTE: `verify-capability` is NOT here — it reuses the LIVE gen-capability-registry
      # validators and is deliberately fail-loud when no gsd-core checkout is reachable ("a check
      # that did not run is NEVER reported conformant"). That makes it a `compat` step by
      # definition, not a `verify` one. Moving it here to get a green would mean either weakening
      # that LOUD-on-miss contract or vendoring a fake validator — both worse than the split.

      # Catches the exact failure mode that bit Phase 12 and again on 2026-07-30: editing
      # hooks/ or hooks/lib/ without regenerating capabilities/contribution-toolkit/.
      - name: build-capability --check (bundle in sync with canonical source)
        run: node bin/build-capability.cjs --check

  compat:
    name: compat (real gsd-core — HARD-01/HARD-02 execute)
    runs-on: ubuntu-latest
    # DELIBERATELY no job-wide `GSD_CORE_ROOT`. The capability-LIFECYCLE tests (install/off/on/remove,
    # contrib-capability.test.cjs) treat a GSD_CORE_ROOT engine as installable, and they were never
    # measured against this job (2026-07-30 they failed 21 cases against the then-unbuilt clone). It
    # is set only on the verify-hooks and verify-capability steps below, which need it.
    #
    # Fault-injection resolves gsd-core from CWD, and the gsd-core-side steps run with
    # `working-directory: gsd-core`, so the HARD-01/HARD-02 proofs execute. Measured 2026-10-07
    # against a built next: "10 of 10 case(s) executed and passed, 0 failed, 0 skipped" (8
    # HARD-01/HARD-02 + 2 hermetic sandbox cases). The earlier "6 case(s) executed" figure was 2
    # FAILING HARD-02 cases masked by EXEC-01; the sandbox now derives its load-time requires.
    #
    # Consequence, stated rather than hidden: the LIVE-backed hook suites (gh-pr-create, gh-edit,
    # gh-issue-create, issue-dedupe) still SKIP in CI. They skip honestly instead of crashing on a
    # hardcoded path; running them for real against this built checkout is a logged follow-up, out
    # of scope here, not silently pretended.
    steps:
      - name: Check out the toolkit
        uses: actions/checkout@v4
        with:
          path: toolkit
          persist-credentials: false

      # `next` is gsd-core's upstream default branch (not `main`) — see the GSD ADR rule.
      - name: Check out open-gsd/gsd-core @ next
        uses: actions/checkout@v4
        with:
          repository: open-gsd/gsd-core
          ref: next
          path: gsd-core
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # gsd-core emits gsd-core/bin/lib/*.cjs from src/*.cts and gitignores most of them
      # (text-lines.cjs since gsd-core #3420, 2026-08-13), which is why compat failed
      # `live-validators-load` on every run from 2026-08-17. `--ignore-scripts` keeps third-party
      # install scripts from running; `build:lib` is gsd-core's own emit step. Node 24 because
      # gsd-core's engines is >=24 (this step must run after setup-node). No cache: about 20 s.
      - name: Build gsd-core (emitted bin/lib is gitignored)
        working-directory: gsd-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:lib

      # Fail EARLY and legibly if the sentinel layout is absent, rather than letting every
      # downstream proof silently skip and report green. This assertion is the honest-green
      # backstop for the checkout itself.
      - name: Assert the gsd-core sentinel layout resolves
        working-directory: gsd-core
        run: |
          node -e "
            const { resolveGsdCoreRoot } = require('../toolkit/hooks/lib/resolve.cjs');
            const root = resolveGsdCoreRoot(process.cwd());
            console.log('gsd-core sentinel resolved at: ' + root);
          "

      # HARD-02: shape-check every LIVE script the gates call, against the real checkout.
      # A gsd-core refactor that renames an export or reshapes a return value fails HERE.
      - name: doctor (LIVE script shape check)
        working-directory: gsd-core
        run: node ../toolkit/hooks/doctor.cjs

      # Both live here, not in `verify`, for the same reason: they reuse LIVE gsd-core scripts and
      # are only meaningful against a real checkout.
      #
      # verify-hooks: 62/62 here vs 14/62 with 48 skips in a checkout-less job (measured
      # 2026-10-07). --require-executed fails the step on ANY skipped case, so a GSD_CORE_ROOT
      # resolution regression cannot pass vacuously.
      # verify-capability: fail-loud when no checkout is reachable ("a check that did not run is
      # NEVER reported conformant").
      - name: verify-hooks (byte-stable deny/allow proofs — all 62 cases must execute)
        working-directory: toolkit
        env:
          GSD_CORE_ROOT: ${{ github.workspace }}/gsd-core
        run: node bin/verify-hooks.cjs --require-executed

      - name: verify-capability (declared == shipped, LIVE registry validators)
        working-directory: toolkit
        env:
          GSD_CORE_ROOT: ${{ github.workspace }}/gsd-core
        run: node bin/verify-capability.cjs

      # CONV-01. `doctor` catches upstream SCRIPT drift; this catches upstream CONVENTION drift —
      # the handful of policies the toolkit cannot call and therefore REPLICATES locally (branch
      # prefixes, exempt lists, POLICY-02 npm script names). Those replicas were the blind spot
      # logged as H-A: in sync as of 2026-07-30, but by hand, with nothing keeping them there.
      # Running it here (and on the weekly schedule) means an upstream change surfaces on its own
      # rather than at the moment a gate wrongly denies real work.
      - name: convention-drift (replicated conventions vs LIVE)
        working-directory: gsd-core
        run: node ../toolkit/bin/convention-drift.cjs

      # The honest-green gate. self-test's EXEC-01 check re-runs hooks/fault-injection.test.cjs
      # with captured stdout and FAILS unless its cases actually executed with zero skips — so
      # this step cannot report success over an unexecuted HARD-01/HARD-02 proof.
      - name: self-test (EXEC-01 — load-bearing proofs must EXECUTE, not skip)
        working-directory: gsd-core
        run: node ../toolkit/bin/self-test.cjs
